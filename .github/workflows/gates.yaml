# Gates over the built package and its C sources, each seen to fail on a
# planted defect before it was trusted (roadmap, principle 6).
#
#   symbols     the shared object exports R_init_zumsgpack only, and
#               references no console-output or process-exit symbol (design
#               section 14)
#   standalone  the check phase builds with no R headers and is clean under
#               ASan and UBSan over every seed in every mode (roadmap Stage 1)
#   conformance the fixtures equal their regeneration from pinned sources, and
#               Python's msgpack agrees with zumsgpack on every object, any
#               difference attributed by rule (roadmap Stage 6); needs the
#               network, so it lives here and never in the test suite
on:
  push:
    branches: [main, master]
  pull_request:

name: gates

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Checked on a plain R CMD INSTALL build, which compiles with R's -DNDEBUG
  # as CRAN does.
  symbols:
    runs-on: ubuntu-latest
    name: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # zufast and zubin are LinkingTo-only and not yet on CRAN: Remotes.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install and inspect the shared object
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          R CMD INSTALL --no-test-load -l "$RUNNER_TEMP/lib" .
          tools/check-symbols "$RUNNER_TEMP/lib/zumsgpack/libs/zumsgpack.so"

  standalone:
    runs-on: ubuntu-latest
    name: standalone check phase
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install clang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
      - name: Build without R and run the seeds sanitized
        env:
          CC: clang
        run: tools/run-standalone

  conformance:
    runs-on: ubuntu-latest
    name: conformance
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::jsonlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the oracle, pinned
        run: python -m pip install msgpack==1.1.1
      - name: Install zumsgpack
        run: R CMD INSTALL .
      - name: Run
        env:
          PYTHON: python
        run: tools/run-conformance
