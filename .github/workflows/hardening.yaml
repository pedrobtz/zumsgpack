# Roadmap Stage 7: the gates that keep the C boundary honest. Each was seen
# to fail on a planted defect before it was trusted.
#
#   lint      project C warning-free under -Wall -Wextra -Wpedantic -Werror,
#             with gcc and clang
#   mutation  every GUARD in the check phase is load-bearing
#   network   no test touches the network
#   fuzz      libFuzzer over the R-free check phase with zucbor's
#             invariants, canary first; the grown corpus is cached between
#             runs, so fuzzing accumulates: 2 minutes per push, 30 nightly
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

name: hardening

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    name: lint, mutation, no network
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install clang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
      - name: Lint with gcc
        env:
          CC: gcc
        run: tools/run-lint
      - name: Lint with clang
        env:
          CC: clang
        run: tools/run-lint
      - name: Mutation check
        env:
          CC: clang
        run: tools/run-mutation-check
      - run: tools/check-no-network

  fuzz:
    runs-on: ubuntu-latest
    name: fuzz (check phase)
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install clang with libFuzzer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
          v=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y -q "libclang-rt-$v-dev" || true
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        env:
          FUZZ_CC: clang
        run: tools/run-fuzz ${{ github.event_name == 'schedule' && 1800 || 120 }}
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
